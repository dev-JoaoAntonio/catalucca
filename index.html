<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="DsvlW9Glex4U9EBQN1JOKyKo221KYmUkqtnuUrVllMk" />
    <meta name="theme-color" content="#0F3E6D">
    <meta name="keywords"
        content="Microscopia Digital, Infraestrutura Científica, Gestão Pública, Tecnologia Agrícola, SMO, DIPLE, BLIPS, Ciência de Borda, Catalucca">
    <link rel="icon" href="/favicon/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&display=swap"
        rel="stylesheet">
    <script>
        // Ativa o estado inicial das animações de entrada antes da primeira
        // pintura. Se o app não subir em 4s, devolve o conteúdo visível.
        document.documentElement.classList.add('js');
        setTimeout(function () {
            if (!window.__catalucca) document.documentElement.classList.remove('js');
        }, 4000);
    </script>
</head>

<body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
